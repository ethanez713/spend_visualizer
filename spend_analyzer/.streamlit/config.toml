# Offline by default (security baseline): no telemetry leaving the machine.
[browser]
gatherUsageStats = false

[client]
# No Deploy button or developer menu on a local, single-user app.
toolbarMode = "minimal"

[server]
headless = true
# Loopback-only: on a server the UI is reached through `tailscale serve`
# (deploy/RUNBOOK.md), never bound to a public interface; harmless on the
# desktop, where the browser is local anyway.
address = "127.0.0.1"
# Serves ./static (the self-hosted webfonts), so the page loads nothing from a CDN.
enableStaticServing = true

# What Streamlit's own widgets and canvas tables take from the design system;
# everything else is mapped in theme.py. Both themes are defined, so the viewer's
# light/dark setting (or the OS preference) picks between them.
[theme]
font = "'Instrument Sans', 'Helvetica Neue', Arial, sans-serif"
headingFont = "Piazzolla, Georgia, 'Times New Roman', serif"
codeFont = "'IBM Plex Mono', ui-monospace, Menlo, monospace"
baseRadius = "7px"
buttonRadius = "7px"
showSidebarBorder = true

[[theme.fontFaces]]
family = "Piazzolla"
url = "app/static/fonts/Piazzolla-400-700.woff2"
weight = "400 700"

[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/InstrumentSans-400-700.woff2"
weight = "400 700"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-400.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-500.woff2"
weight = 500

[theme.light]
primaryColor = "#DD7A32"
backgroundColor = "#F8F6F1"
secondaryBackgroundColor = "#F1EDE5"
textColor = "#3E3830"
borderColor = "#D8D1C5"
dataframeBorderColor = "#E8E2D8"
dataframeHeaderBackgroundColor = "#F1EDE5"
linkColor = "#944A17"
codeBackgroundColor = "#F1EDE5"

[theme.dark]
primaryColor = "#DD7A32"
backgroundColor = "#15130E"
secondaryBackgroundColor = "#2B271F"
textColor = "#D6D0C5"
borderColor = "#504A3F"
dataframeBorderColor = "#3A352C"
dataframeHeaderBackgroundColor = "#2B271F"
linkColor = "#F6C08B"
codeBackgroundColor = "#2B271F"

[theme.light.sidebar]
backgroundColor = "#F1EDE5"
secondaryBackgroundColor = "#FDFCF9"

[theme.dark.sidebar]
backgroundColor = "#0E0C09"
secondaryBackgroundColor = "#2B271F"
