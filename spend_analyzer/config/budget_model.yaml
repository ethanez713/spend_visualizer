# How tier-1 categories (taxonomy.yaml) become the budget's categories. A tier-1 name
# not listed in `fold` is its own budget category. `atoms` beats `fold` for one PFC
# detailed code; `drop_atoms` are PFC detailed-code patterns that are never budget
# spending whatever the merchant, so a taxonomy merchant override cannot revive them.
# Household rules (pinned merchants, goals) live in the personal budget.yaml.
fold:
  Services: Other
  Fees: Other
  Loans: Other
  Personal Care: Other
  Government: Other

atoms:
  PERSONAL_CARE_GYMS_AND_FITNESS_CENTERS: Healthcare
  GENERAL_SERVICES_AUTOMOTIVE: Transportation

drop_atoms:
  - INCOME_*
  - TRANSFER_IN_*
  - TRANSFER_OUT_*
  - LOAN_PAYMENTS_CREDIT_CARD_PAYMENT
  - GOVERNMENT_AND_NON_PROFIT_TAX_PAYMENT
